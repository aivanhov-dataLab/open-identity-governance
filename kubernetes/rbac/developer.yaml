apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: workloads
  labels:
    app.kubernetes.io/part-of: open-identity-governance
    app.kubernetes.io/component: authorization
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
  namespace: workloads
  labels:
    app.kubernetes.io/part-of: open-identity-governance
    app.kubernetes.io/component: authorization
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: workloads
roleRef:
  kind: Role
  name: developer
  apiGroup: rbac.authorization.k8s.io